<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bekar Anneler ile Kırmızı Fil Atölye'de Buluşuyoruz!</title>
    
    <!-- WhatsApp Ön İzleme Ayarları (Ön izlemede onizleme.png görünecek) -->
    <meta property="og:title" content="Bekar Anneler ile Kırmızı Fil Atölye'de Buluşuyoruz! 💜">
    <meta property="og:description" content="14 Kasım Cumartesi saat 17:00'de Kırmızı Fil Atölye'de buluşuyor, tanışıyor ve pelvik taban sağlığı üzerine konuşuyoruz. Detaylar ve kayıt için tıkla!">
    <meta property="og:image" content="https://kullaniciadin.github.io/depo-adi/onizleme.png">
    <meta property="og:url" content="https://kullaniciadin.github.io/depo-adi/">
    <meta property="og:type" content="website">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Konfeti Efekti İçin Kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
            color: #4a235a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .invitation-card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(118, 68, 138, 0.15);
            overflow: hidden;
            border: 2px solid #f8bbd0;
            text-align: center;
            padding: 30px 25px;
        }
        /* Web Sitesinde Görünecek Ana Davetiye Görseli */
        .poster-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(142, 68, 173, 0.15);
            border: 1px solid #f3e5f5;
        }
        .poster-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Canlı Geri Sayım Alanı */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: #f4ecf7;
            padding: 15px;
            border-radius: 16px;
        }
        .countdown-box {
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 10px;
            min-width: 60px;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.08);
        }
        .countdown-box span {
            display: block;
            font-size: 18px;
            font-weight: 700;
            color: #8e44ad;
        }
        .countdown-box small {
            font-size: 11px;
            color: #6c3483;
        }
        /* Butonlar Grubu */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .cta-btn {
            display: block;
            background: linear-gradient(135deg, #af7ac5 0%, #8e44ad 100%);
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(142, 68, 173, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(142, 68, 173, 0.4);
        }
        .secondary-btns {
            display: flex;
            gap: 10px;
        }
        .sec-btn {
            flex: 1;
            background: #ffffff;
            color: #8e44ad;
            border: 2px solid #d7bde2;
            text-decoration: none;
            padding: 10px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .sec-btn:hover {
            background: #f4ecf7;
        }
        @media(max-width: 480px) {
            .secondary-btns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        
        <!-- Sitenin İçinde Görünecek Davetiye Görseli (davetiye.png) -->
        <div class="poster-container">
            <img src="davetiye.png" alt="Bekar Anneler ile Kırmızı Fil Atölye'de Buluşma Davetiyesi">
        </div>

        <!-- Canlı Geri Sayım Sayacı -->
        <div class="countdown-container">
            <div class="countdown-box">
                <span id="days">00</span>
                <small>Gün</small>
            </div>
            <div class="countdown-box">
                <span id="hours">00</span>
                <small>Saat</small>
            </div>
            <div class="countdown-box">
                <span id="minutes">00</span>
                <small>Dakika</small>
            </div>
            <div class="countdown-box">
                <span id="seconds">00</span>
                <small>Saniye</small>
            </div>
        </div>

        <!-- Etkileşimli Butonlar -->
        <div class="action-buttons">
            <!-- Güncellenen Google Anket Linki -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSekNtIMtBlqUhB0JKnNSm7buyQiyVl6I1WCpQxI7PRTZGabog/viewform?usp=header" target="_blank" class="cta-btn">
                📝 Kayıt Ol & Anketi Doldur
            </a>
            
            <div class="secondary-btns">
                <!-- Yol Tarifi Linki -->
                <a href="https://maps.app.goo.gl/B7YirNezdriTJN9YA" target="_blank" class="sec-btn">
                    🗺️ Yol Tarifi Al
                </a>
                <!-- Takvime Ekle (Google Calendar Linki) -->
                <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Bekar+Anneler+ile+Kırmızı+Fil+Atölye+Buluşması&dates=20261114T140000Z/20261114T170000Z&details=Kırmızı+Fil+Atölye+ev+sahipliğinde+buluşma,+tanışma+ve+pelvik+taban+sunumu.&location=Tunalı+Hilmi+Cd.+No:+123,+Çankaya/Ankara" target="_blank" class="sec-btn">
                    📅 Takvime Ekle
                </a>
            </div>
        </div>
    </div>

    <script>
        // Sayfa açıldığında konfeti patlatma
        window.onload = function() {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#af7ac5', '#8e44ad', '#f8bbd0', '#f5b7b1']
            });
        };

        // Geri Sayım Sayacı Mantığı (14 Kasım 2026, 17:00)
        const eventDate = new Date("November 14, 2026 17:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const diff = eventDate - now;

            if (diff < 0) {
                clearInterval(timer);
                document.querySelector(".countdown-container").innerHTML = "<span style='color:#8e44ad; font-weight:600;'>Etkinliğimiz başladı! 💜</span>";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
